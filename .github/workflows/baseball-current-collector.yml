name: Current baseball collector
on:
  push:
    branches: [data/live-source-probe-20260915]
    paths:
      - .github/workflows/baseball-current-collector.yml
      - server/baseball-live-providers.mjs
      - scripts/collect-baseball-live.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: current-baseball-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            server/baseball-live-providers.mjs
            scripts/collect-baseball-live.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check parser syntax
        run: node --check server/baseball-live-providers.mjs
      - name: Collect current first-team baseball and validate live changes
        run: node scripts/collect-baseball-live.mjs
      - name: Retain normalized data and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-current
          path: baseball-current/
          retention-days: 7
