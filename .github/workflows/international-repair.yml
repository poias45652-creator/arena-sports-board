name: International repair verification
on:
  push:
    branches: ['fix/international-data-20260922']
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'server/**'
      - 'tests/**'
      - 'scripts/international-*'
      - '.github/workflows/international-repair.yml'
permissions:
  contents: read
concurrency:
  group: international-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Repair regressions
        run: node --test tests/international-repair.test.mjs
      - run: npm run build
  public-source-probe:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/international-source-probe.mjs
      - name: Verify parsed public pitching fallback
        run: node scripts/international-pitching-smoke.mjs
