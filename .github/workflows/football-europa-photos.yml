name: Verify Europa player portraits
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/football-photos/collect.py'
      - '.github/workflows/football-europa-photos.yml'
permissions:
  contents: read
jobs:
  collect:
    if: startsWith(github.head_ref, 'fix/yj-europa-player-photos-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Collect current Europa rosters and provider identities
        run: python scripts/football-photos/collect.py --cache /tmp/europa-photos --season 2026 --league uefa.europa --phase collect
      - name: Match full names and birth dates
        run: python scripts/football-photos/collect.py --cache /tmp/europa-photos --season 2026 --league uefa.europa --phase match
      - name: Resolve spelling variants against verified team membership
        run: python scripts/football-photos/collect.py --cache /tmp/europa-photos --season 2026 --league uefa.europa --phase enrich
      - name: Check actual photo bytes and reject placeholder images
        run: python scripts/football-photos/collect.py --cache /tmp/europa-photos --season 2026 --league uefa.europa --phase verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europa-portrait-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/europa-photos
          retention-days: 7
          if-no-files-found: error
