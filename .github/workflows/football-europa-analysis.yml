name: Collect Europa analysis evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/collect-football-europa.py'
      - '.github/workflows/football-europa-analysis.yml'
permissions:
  contents: read
jobs:
  collect:
    if: startsWith(github.head_ref, 'fix/yj-europa-analysis-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/collect-football-europa.py /tmp/europa-analysis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europa-analysis-${{ github.run_id }}
          path: /tmp/europa-analysis
          retention-days: 7
          if-no-files-found: error
