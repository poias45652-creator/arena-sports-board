name: NBA individual strength data
on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nba-player-strength.py'
      - '.github/workflows/nba-player-strength-sync.yml'
permissions:
  contents: write
concurrency:
  group: nba-player-strength-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate identity reuse and integrity protections
        run: python scripts/test_nba_identity_refresh.py
      - name: Refresh verified individual results
        run: python scripts/nba-player-strength.py --refresh
      - name: Publish validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba-player-strength.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh NBA player strength snapshot'
            git push origin HEAD:main
          fi
