name: Missing baseball data research
on:
  push:
    branches: ['research/missing-baseball-data-20260922']
    paths: ['.github/workflows/missing-data-research.yml']
permissions:
  contents: read
jobs:
  read-public-records:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify selected public records without production access
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {plain,tableData} from './server/baseball-live-providers.mjs';
          const read=async url=>{
            const r=await fetch(url,{redirect:'manual',headers:{'User-Agent':'YJBaseballSourceAudit/1.0',Accept:'text/html'},signal:AbortSignal.timeout(12000)});
            if(!r.ok){await r.body?.cancel();throw Error('HTTP '+r.status);}
            let size=0;const chunks=[];for await(const c of r.body){size+=c.byteLength;if(size>4000000)throw Error('response_too_large');chunks.push(c);}
            const html=Buffer.concat(chunks).toString('utf8');if(/challenge-platform|<title>Just a moment/i.test(html))throw Error('public_access_challenge');
            return {html,observedAt:new Date().toISOString()};
          };
          console.log('ENV',JSON.stringify({execution:'GitHub Actions, not Render',observedAt:new Date().toISOString(),productionChanged:false}));
          const cpblUrls=[
            'https://www.lottonavi.com/matches/cpbl/',
            'https://www.lottonavi.com/statistical/cpbl/uni-president-7-eleven-lions/',
            'https://www.lottonavi.com/player/cpbl/0000001412/%E6%B1%9F%E5%B0%91%E6%85%B6/game-logs/',
            'https://www.lottonavi.com/player/cpbl/6720/%E9%82%B1%E9%A7%BF%E5%A8%81/year-by-year/'
          ];
          for(let i=0;i<cpblUrls.length;i+=2)await Promise.all(cpblUrls.slice(i,i+2).map(async url=>{
            try{const {html,observedAt}=await read(url),tables=tableData(html),names=['江少慶','羅戈','瑪帝斯','鋼龍','江承諺','邱駿威'];
              const rows=tables.filter(t=>t.rows.some(r=>r.some(x=>names.includes(x)||/^2026$/.test(x)))).map(t=>({headers:t.rows.slice(0,2),rows:t.rows.filter(r=>r.some(x=>names.includes(x)||/^2026$/.test(x))).slice(0,8)}));
              const logs=tables.filter(t=>t.rows[0]?.includes('球數')&&t.rows[0]?.includes('局數')).map(t=>({headers:t.rows[0],count:t.rows.length-1,latest:t.rows.slice(1,6)}));
              const links=[...html.matchAll(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi)].filter(m=>/統一獅|味全龍|富邦悍將|中信兄弟|台鋼雄鷹|樂天桃猿|服務條款|使用條款/.test(plain(m[2]))||names.includes(plain(m[2]))).map(m=>({url:new URL(m[1],url).href,label:plain(m[2])})).filter(m=>/lottonavi.com|fengyuncai.com/.test(new URL(m.url).hostname)).slice(0,30);
              const titles=[...html.matchAll(/<h[1-4]\b[^>]*>([\s\S]*?)<\/h[1-4]>/gi)].map(m=>plain(m[1])).filter(s=>/2026|星期|累計|例行|賽季/.test(s));
              console.log('CPBL_RECORDS',JSON.stringify({url,observedAt,title:plain(html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]||''),titles,rows,logs,links}));
            }catch(e){console.log('SOURCE_ERROR',JSON.stringify({url,error:e.message}));}
          }));
          const roster='https://www.koreabaseball.com/Player/RegisterAll.aspx';
          try{const {html,observedAt}=await read(roster),links=[...html.matchAll(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi)].filter(m=>plain(m[2]).includes('클레빈저')).map(m=>({url:new URL(m[1],roster).href,label:plain(m[2])}));
            console.log('KBO_ROSTER',JSON.stringify({url:roster,observedAt,links,matchedRows:tableData(html).flatMap(t=>t.rows).filter(r=>r.some(c=>c.includes('클레빈저'))).slice(0,3)}));
          }catch(e){console.log('SOURCE_ERROR',JSON.stringify({url:roster,error:e.message}));}
          const url='https://baseball.yahoo.co.jp/npb/game/2021039451/top';
          try{const {html,observedAt}=await read(url),region=html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'').replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,'');const context=[];
            for(const m of region.matchAll(/18:00|試合開始|プレイボール/g)){const part=region.slice(Math.max(0,m.index-320),m.index+200);if(!/href=["'][^"']*$/.test(part))context.push(part.replace(/\s+/g,' ').slice(0,520));}
            console.log('NPB_CLOCK_MARKUP',JSON.stringify({url,observedAt,title:plain(html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]||''),contexts:context.slice(0,4)}));
          }catch(e){console.log('SOURCE_ERROR',JSON.stringify({url,error:e.message}));}
          JS
