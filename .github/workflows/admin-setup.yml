name: Admin setup regression
on:
  push:
    branches: [main, fix/admin-setup-20260911]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: node:20-bookworm
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-only
          POSTGRES_DB: arena_admin_setup_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres-test-only@postgres:5432/arena_admin_setup_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - name: Install existing application dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: node --check server.mjs && node --check public/app.js
      - name: Run regression tests against disposable PostgreSQL 18
        run: node --test test/admin-setup.integration.test.mjs
      - name: Verify production using GET requests only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/smoke-admin.mjs
