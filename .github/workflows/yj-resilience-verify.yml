name: YJ runtime resilience verification
on:
  push:
    branches: [fix/yj-runtime-resilience-20261005]
  pull_request:
    paths:
      - app/api/baseball/**
      - app/api/free-trial/**
      - app/game-context.tsx
      - server/runtime-cache.mjs
      - server/source-resilience.mjs
      - lib/covers-fetch.ts
      - lib/playsport-pregame.ts
      - lib/international-profile-source.ts
      - lib/international-teams.ts
      - lib/free-trial.ts
      - tests/free-trial.test.mjs
      - tests/render-free-trial-npb.test.mjs
      - tests/render-runtime-*.mjs
      - .github/workflows/yj-resilience-verify.yml
permissions:
  contents: read
concurrency:
  group: yj-resilience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node tests/run-render-http-smoke.mjs
