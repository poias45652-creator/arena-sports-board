name: V63 dependency verification
on:
  push:
    branches: ['migration/v63-original']
    paths:
      - '.migration/v63/dependencies/package.json'
      - '.github/workflows/v63-dependencies.yml'
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned application dependencies
        working-directory: .migration/v63/dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify tools and package the dependency snapshot
        working-directory: .migration/v63/dependencies
        run: |
          node -v
          node -p "require('next/package.json').version"
          node -p "require('typescript/package.json').version"
          tar -czf v63-build-dependencies.tar.gz node_modules package-lock.json package.json
          sha256sum v63-build-dependencies.tar.gz > v63-build-dependencies.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: v63-build-dependencies
          path: |
            .migration/v63/dependencies/v63-build-dependencies.tar.gz
            .migration/v63/dependencies/v63-build-dependencies.sha256
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
