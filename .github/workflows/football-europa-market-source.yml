name: Verify public Europa market categories
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/collect-europa-market-source.py'
      - '.github/workflows/football-europa-market-source.yml'
permissions:
  contents: read
jobs:
  collect:
    if: startsWith(github.head_ref, 'fix/yj-europa-market-source-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/collect-europa-market-source.py /tmp/europa-market-source
      - uses: actions/upload-artifact@v4
        with:
          name: europa-market-source-${{ github.run_id }}
          path: /tmp/europa-market-source
          retention-days: 7
          if-no-files-found: error
