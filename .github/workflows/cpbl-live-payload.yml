name: CPBL current payload probe
on:
  push:
    branches: [data/live-source-probe-20260915]
    paths: [.github/workflows/cpbl-live-payload.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current CPBL game payloads
        run: |
          mkdir -p cpbl-payload
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,re,datetime,html
          from pathlib import Path
          out=Path('cpbl-payload'); results=[]
          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))); day=now.strftime('%Y-%m-%d'); key=now.strftime('%y%m%d')
          def save(label,j): (out/(label+'.json')).write_text(json.dumps(j,ensure_ascii=False,indent=2),encoding='utf8')
          def read(label,url):
              url=urllib.parse.quote(url,safe=':/?=&%')
              r={'id':label,'url':url,'requestedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  if urllib.parse.urlparse(url).hostname!='tw.sports.yahoo.com':raise ValueError('unapproved host')
                  req=urllib.request.Request(url,headers={'User-Agent':'YJBaseballSourceCheck/1.0','Accept':'text/html,application/json'})
                  with urllib.request.urlopen(req,timeout=20) as f:
                      b=f.read(6000001);r.update(httpStatus=f.status,bytes=len(b),serverDate=f.headers.get('Date'),cacheControl=f.headers.get('Cache-Control'))
                      if len(b)>6000000:raise ValueError('response cap')
                      r['fetchedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat();return b.decode('utf8')
              except Exception as e:r['error']=str(e);return ''
              finally:results.append(r);print('REQUEST '+json.dumps(r,ensure_ascii=False),flush=True)
          def extract(label,t,gid):
              chunks=[];tables=[];objects=[];schemas=[];rsc=[]
              for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',t,re.S|re.I):
                  if 'application/ld+json' in attrs:
                      try:schemas.append(json.loads(body))
                      except ValueError:pass
                  m=re.fullmatch(r'self\.__next_f\.push\((\[.*\])\);?',body,re.S)
                  if m:
                      try:
                          parts=json.loads(m[1])
                          if len(parts)>1 and parts[0]==1 and isinstance(parts[1],str):rsc.append(parts[1])
                      except ValueError:pass
              joined=''.join(rsc)
              def walk(x,path='',depth=0):
                  if depth>30:return
                  if isinstance(x,dict):
                      identity=[x.get(k) for k in ('id','gameId','gameid','game_id')]
                      if any(isinstance(v,str) and ('cpbl.g.'+gid in v or v==gid) for v in identity):objects.append({'path':path,'data':x})
                      for k,v in x.items():walk(v,path+'/'+str(k),depth+1)
                  elif isinstance(x,list):
                      for i,v in enumerate(x):walk(v,path+'/'+str(i),depth+1)
              for line in joined.splitlines():
                  _,_,payload=line.partition(':')
                  if payload.startswith(('{','[')):
                      try:walk(json.loads(payload),line.split(':',1)[0])
                      except ValueError:pass
              for m in list(re.finditer(re.escape('cpbl.g.'+gid),joined))[:18]:
                  chunks.append(joined[max(0,m.start()-200):m.start()+2600])
              for table in re.findall(r'<table\b[^>]*>(.*?)</table>',t,re.S|re.I):
                  rows=[]
                  for tr in re.findall(r'<tr\b[^>]*>(.*?)</tr>',table,re.S|re.I):
                      cells=[re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',x))).strip() for x in re.findall(r'<t[hd]\b[^>]*>(.*?)</t[hd]>',tr,re.S|re.I)]
                      if cells:rows.append(cells)
                  if rows:tables.append(rows)
              facts={'gameId':gid,'title':re.findall(r'<title[^>]*>(.*?)</title>',t,re.S),'schema':schemas,'gameObjects':objects,'gamePayloadExcerpts':chunks,'tables':tables}
              save(label,facts)
              print('GAME '+json.dumps({'label':label,'title':facts['title'],'objects':len(objects),'schemas':schemas,'tables':len(tables)},ensure_ascii=False),flush=True)
          found={};recent=None
          for team in ['富邦','統一','台鋼']:
              u='https://tw.sports.yahoo.com/cpbl/teams/'+urllib.parse.quote(team)+'/'
              t=read('team-'+team,u)
              links=re.findall(r'href=[\'\"]([^\'\"]*/cpbl/[^\'\"?]+-\d{9}/)[\'\"]',t)
              for a in links:
                  a=html.unescape(a);m=re.search(r'-(\d{9})/$',a)
                  if not m:continue
                  if m[1].startswith(key):found[m[1]]=urllib.parse.urljoin(u,a)
                  elif m[1][:6]<key and (recent is None or m[1]>recent[0]):recent=(m[1],urllib.parse.urljoin(u,a))
          for gid,u in list(found.items())[:3]:extract('cpbl-'+gid,read('cpbl-'+gid,u),gid)
          if recent:
              gid,u=recent;extract('cpbl-recent-'+gid,read('cpbl-recent-'+gid,u),gid)
          save('today-games',{'date':day,'games':found,'recentSample':recent});save('requests',results)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpbl-current-payload
          path: cpbl-payload/
          retention-days: 3
