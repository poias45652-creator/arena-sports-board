name: Basketball pages and model weights
on:
  pull_request:
    paths:
      - 'app/nba*.tsx'
      - 'app/basketball-*.tsx'
      - 'app/api/wnba/route.ts'
      - 'lib/wnba-source.ts'
      - 'lib/nba-source.ts'
      - 'tests/basketball-live*'
      - 'tests/wnba-model-weights.test.mjs'
      - 'tests/fixtures/basketball-live/**'
      - 'app/nba.css'
      - 'app/api/nba/route.ts'
      - 'lib/nba-model-weights.ts'
      - 'lib/basketball*.ts'
      - 'tests/nba-model-weights-browser.mjs'
      - '.github/workflows/nba-model-weights.yml'
permissions:
  contents: read
concurrency:
  group: nba-model-weights-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Install browser test tools separately
        run: |
          npm install --prefix /tmp/basketball-browser playwright@1.51.1
          /tmp/basketball-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify desktop and mobile weights against the built application
        run: node tests/nba-model-weights-browser.mjs
      - name: Verify NBA and WNBA match centres on desktop and mobile
        run: node tests/basketball-live-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-model-weights-${{ github.run_id }}
          path: |
            evidence/nba-weights/
            evidence/basketball-live/
          retention-days: 7
          if-no-files-found: warn
