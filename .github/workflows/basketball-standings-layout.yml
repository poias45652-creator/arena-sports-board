name: Basketball standings layout
on:
  pull_request:
    paths:
      - 'app/basketball-standings.tsx'
      - 'app/nba.css'
      - 'app/xingzhun-theme.css'
      - 'app/page.tsx'
      - 'tests/basketball-standings-layout-browser.mjs'
      - '.github/workflows/basketball-standings-layout.yml'
permissions:
  contents: read
concurrency:
  group: basketball-standings-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Install Chromium and WebKit
        run: |
          npm install --prefix /tmp/basketball-layout-browser playwright@1.56.1
          /tmp/basketball-layout-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify NBA and WNBA standings at phone and desktop widths
        run: node tests/basketball-standings-layout-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basketball-standings-layout-${{ github.run_id }}
          path: evidence/basketball-standings-layout/
          retention-days: 7
          if-no-files-found: warn
