name: YJ NBA loading verification
on:
  pull_request:
    paths:
      - 'lib/nba-source.ts'
      - 'lib/nba-analysis-cache.ts'
      - 'lib/nba-official.ts'
      - 'lib/nba-official-cache.ts'
      - 'lib/nba-player-strength-source.ts'
      - 'tests/nba-speed.test.mjs'
      - 'scripts/benchmark-nba-loading.mjs'
      - '.github/workflows/nba-loading-verify.yml'
permissions:
  contents: read
concurrency:
  group: yj-nba-loading-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASELINE_SHA: 359d82fcc3875dd750a68effd69d38af5d313174
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Regression tests for concurrency freshness and memory limits
        run: node --test tests/nba-speed.test.mjs tests/nba-source.test.mjs tests/nba-profile.test.mjs tests/basketball-loading.test.mjs
      - name: Full application regression suite
        run: npm test
      - name: Build production application
        run: npm run build
      - name: Prepare isolated baseline with identical player statistics
        run: |
          git fetch --depth=1 origin "$BASELINE_SHA"
          mkdir -p evidence/baseline
          git archive "$BASELINE_SHA" lib data package.json | tar -x -C evidence/baseline
          cp data/nba-player-strength.json evidence/baseline/data/nba-player-strength.json
      - name: Live baseline latency without credentials or production writes
        id: baseline
        continue-on-error: true
        run: |
          cd evidence/baseline
          NBA_BENCH_CODE_REF="$BASELINE_SHA" node --expose-gc "$GITHUB_WORKSPACE/scripts/benchmark-nba-loading.mjs" baseline "$GITHUB_WORKSPACE/evidence/nba-loading-baseline.json"
      - name: Live candidate cold and warm latency
        id: candidate
        continue-on-error: true
        run: node --expose-gc scripts/benchmark-nba-loading.mjs candidate evidence/nba-loading-candidate.json
      - name: Record comparable measurements
        if: always()
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          const load=p=>{try{return JSON.parse(readFileSync(p,'utf8'));}catch{return null;}};
          const baseline=load('evidence/nba-loading-baseline.json'),candidate=load('evidence/nba-loading-candidate.json');
          const comparable=!!(baseline?.passed&&candidate?.passed&&baseline.day===candidate.day&&baseline.snapshotCapturedAt===candidate.snapshotCapturedAt&&JSON.stringify(baseline.phases[0].rows.map(g=>g.id))===JSON.stringify(candidate.phases[0].rows.map(g=>g.id)));
          const report={runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,commit:process.env.GITHUB_SHA,comparable,baseline,candidate,note:'Public-source measurements on a GitHub runner, not user-browser or Render latency. Source/network variation affects cold timings.'};
          if(comparable)report.comparison=baseline.phases.map((p,i)=>({phase:p.phase,baselineMs:p.elapsedMs,candidateMs:candidate.phases[i].elapsedMs,reductionPercent:Math.round((1-candidate.phases[i].elapsedMs/p.elapsedMs)*10000)/100}));
          mkdirSync('evidence',{recursive:true});writeFileSync('evidence/nba-loading-comparison.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify({comparable,comparison:report.comparison},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yj-nba-loading-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/nba-loading-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require real candidate analysis readiness
        if: steps.candidate.outcome != 'success'
        run: exit 1
