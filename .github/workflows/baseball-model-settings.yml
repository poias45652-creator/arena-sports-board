name: Baseball model settings
on:
  pull_request:
    paths:
      - 'app/baseball-model*'
      - 'app/page.tsx'
      - 'app/globals.css'
      - 'app/pregame.tsx'
      - 'app/markets.tsx'
      - 'app/international-*.tsx'
      - 'lib/baseball-model*'
      - 'lib/mlb-model*'
      - 'lib/baseball-run-analysis.ts'
      - 'lib/multifactor-win.ts'
      - 'lib/winner-analysis.ts'
      - 'tests/baseball-model*'
      - 'tests/pk-consistency.test.mjs'
      - '.github/workflows/baseball-model-settings.yml'
permissions:
  contents: read
concurrency:
  group: baseball-model-settings-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Install isolated browser tools
        run: |
          npm install --prefix /tmp/basketball-browser playwright@1.51.1
          /tmp/basketball-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify baseball on desktop and mobile
        run: node tests/baseball-model-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseball-model-settings-${{ github.run_id }}
          path: evidence/baseball-model/
          retention-days: 7
          if-no-files-found: warn
