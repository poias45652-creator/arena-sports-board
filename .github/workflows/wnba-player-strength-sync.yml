name: WNBA individual strength data
on:
  schedule:
    - cron: '35 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wnba-player-strength-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh verified WNBA individual results
        run: python scripts/wnba-player-strength.py --refresh
      - name: Publish verified snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/wnba-player-strength.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh WNBA player strength snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
