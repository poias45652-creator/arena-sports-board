name: YJ WNBA seeded cold-start verification
on:
  push:
    branches: ['fix/yj-wnba-seeded-coldstart-20261005']
permissions:
  contents: read
concurrency:
  group: yj-wnba-coldstart-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify basketball identity, outage and seed protections
        run: node --test tests/nba*.test.mjs tests/wnba*.test.mjs tests/basketball*.test.mjs tests/sport-super-markets.test.mjs
      - name: Prepare actual WNBA historical sources in a bounded worker
        run: node scripts/prepare-wnba-public-cache.mjs
      - name: Verify both real analyses with historical summary requests prohibited
        run: node scripts/verify-wnba-seeded-analysis.mjs 2026-10-08
      - name: Full regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yj-wnba-coldstart-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/wnba-seeded-verification.json
            data/wnba-public-cache-seed.json
          retention-days: 3
