name: Missing baseball source discovery
on:
  push:
    branches: ['research/missing-sources-20260922']
permissions:
  contents: read
jobs:
  public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/international-source-discovery.mjs
