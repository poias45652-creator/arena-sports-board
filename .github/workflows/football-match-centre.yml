name: Football match centre and model settings
on:
  pull_request:
    paths:
      - 'app/football*'
      - 'app/api/football/route.ts'
      - 'lib/football*'
      - 'tests/football-live*'
      - 'tests/football-model-weights*'
      - 'tests/fixtures/football-live/**'
      - '.github/workflows/football-match-centre.yml'
permissions:
  contents: read
concurrency:
  group: football-match-centre-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Install isolated browser tools
        run: |
          npm install --prefix /tmp/basketball-browser playwright@1.51.1
          /tmp/basketball-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify football on desktop and mobile
        run: node tests/football-live-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-match-centre-${{ github.run_id }}
          path: evidence/football-live/
          retention-days: 7
          if-no-files-found: warn
