name: YJ loading optimization verification
on:
  push:
    branches: [perf/yj-loading-20261005]
permissions:
  contents: read
concurrency:
  group: yj-loading-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'poias45652-creator/arena-sports-board'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/yj-loading-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build current baseline
        run: npm run build
      - name: Measure baseline dashboard chunks
        run: node scripts/measure-yj-loading.mjs baseline /tmp/yj-loading-before.json
      - name: Apply guarded YJ-only source edits
        run: |
          if test -f scripts/apply-yj-loading-optimization.mjs; then
            node scripts/apply-yj-loading-optimization.mjs
            node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          let page=fs.readFileSync('app/page.tsx','utf8');
          for(const [before,after] of [
            ['<Standings active/>',"<Standings active={view==='overview'||view==='standings'}/>"],
            ['<Pregame active/>',"<Pregame active={view==='overview'||view==='analysis'}/>"],
          ]) {
            assert.equal(page.split(before).length-1,1,'Unexpected active-view guard');
            page=page.replace(before,after);
          }
          fs.writeFileSync('app/page.tsx',page);
          JS
          fi
          git diff --check
      - name: Test loading, cancellation and caching safeguards
        run: node --test tests/yj-loading-performance.test.mjs
      - name: Run full regression suite
        run: npm test
      - name: Build optimized production app
        run: npm run build
      - name: Verify production HTTP routes
        run: node tests/run-render-http-smoke.mjs
      - name: Measure optimized dashboard chunks
        run: node scripts/measure-yj-loading.mjs optimized /tmp/yj-loading-after.json
      - name: Persist verified source and measurement
        run: |
          mkdir -p reports
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('/tmp/yj-loading-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('/tmp/yj-loading-after.json','utf8'));
          assert.equal(before.metric,after.metric,'Measurements must use the same method');
          assert.ok(after.gzipBytes <= before.gzipBytes,'Initial JS must not increase');
          const report={capturedAt:new Date().toISOString(),runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,testedBase:process.env.GITHUB_SHA,before,after,reductionPercent:Math.round((1-after.gzipBytes/before.gzipBytes)*1000)/10,checks:{loadingTests:'passed',fullRegression:'passed',productionBuild:'passed',httpSmoke:'passed'},scope:'YJ only; no prediction, authentication or Maya changes'};
          fs.writeFileSync('reports/yj-loading-20261005.json',JSON.stringify(report,null,2)+'\n');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/use-sport-live.ts app/use-league-live.ts app/navigation-work.ts app/login/page.tsx app/login/background-video.tsx next.config.ts tests/yj-loading-performance.test.mjs reports/yj-loading-20261005.json
          if test -f scripts/apply-yj-loading-optimization.mjs; then git rm scripts/apply-yj-loading-optimization.mjs; fi
          if ! git diff --cached --quiet; then
            git commit -m 'perf(yj): ship tested on-demand boards, deferred badges and video'
            git push origin HEAD:perf/yj-loading-20261005
          fi
