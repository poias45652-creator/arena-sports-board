name: International player photos
on:
  push:
    branches: ['fix/international-player-photos-20260923']
    paths:
      - 'app/international-team-profile.tsx'
      - 'app/globals.css'
      - 'lib/international-profile-source.ts'
      - '.github/workflows/international-player-photos.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify official NPB and KBO photo sources
        run: |
          node --input-type=module <<'JS'
          const headers={'User-Agent':'YJBaseballStats/1.0'};
          const npb=await fetch('https://npb.jp/bis/players/51155155.html',{headers});
          const npbHtml=await npb.text();
          if(!npb.ok||!/players_photo\/2026\/[^"'<>\s]+\.jpg/i.test(npbHtml))throw new Error('NPB official player photo not found');

          const ymd=t=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(t));
          const end=ymd(Date.now()),start=ymd(Date.now()-30*86400000);
          const schedule=await fetch('https://api-gw.sports.naver.com/schedule/games?categoryId=kbo&fromDate='+start+'&toDate='+end+'&page=1&size=100',{headers});
          const scheduleJson=await schedule.json();
          const games=(scheduleJson.result?.games||[]).filter(g=>g.categoryId==='kbo'&&(g.homeTeamCode==='LG'||g.awayTeamCode==='LG')).sort((a,b)=>String(b.gameDateTime||b.gameDate).localeCompare(String(a.gameDateTime||a.gameDate)));
          if(!games.length)throw new Error('No recent LG game found');
          const game=games[0],poll=await fetch('https://api-gw.sports.naver.com/schedule/games/'+game.gameId+'/game-polling',{headers}),pollJson=await poll.json(),side=game.homeTeamCode==='LG'?'home':'away',lineup=pollJson.result?.textRelayData?.[side+'Lineup'];
          const batter=(lineup?.batter||[]).find(p=>p.pcode),pitcher=(lineup?.pitcher||[]).find(p=>p.pcode),person=batter||pitcher;
          if(!person)throw new Error('No KBO player code in recent LG roster');
          const kind=batter?'Hitter':'Pitcher',profileUrl='https://eng.koreabaseball.com/Teams/PlayerInfo'+kind+'/Summary.aspx?pcode='+person.pcode,profile=await fetch(profileUrl,{headers}),profileHtml=await profile.text();
          const expected='KBO_IMAGE/person/middle/2026/'+person.pcode+'.jpg';
          if(!profile.ok||!profileHtml.includes(expected)||!/<b>\s*Name\s*<\/b>\s*:\s*[^<]+/i.test(profileHtml))throw new Error('KBO official profile/photo not found');
          const photo='https://6ptotvmi5753.edge.naverncp.com/'+expected;
          const image=await fetch(photo,{method:'HEAD',headers});
          if(!image.ok)throw new Error('KBO official player photo not reachable: '+photo);
          console.log(JSON.stringify({npb:true,kbo:true,pcode:person.pcode,photo}));
          JS
