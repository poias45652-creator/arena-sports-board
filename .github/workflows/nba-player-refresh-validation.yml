name: NBA player refresh validation
on:
  pull_request:
    paths:
      - 'scripts/nba-player-strength.py'
      - 'scripts/test_nba_identity_refresh.py'
      - 'scripts/verify-nba-live-analysis.mjs'
      - 'data/nba-player-strength.json'
      - 'lib/nba*.ts'
      - 'lib/basketball*.ts'
      - '.github/workflows/nba-player-refresh-validation.yml'
      - '.github/workflows/nba-player-strength-sync.yml'
  push:
    branches: ['fix/yj-nba-player-refresh-20261005']
    paths:
      - 'scripts/nba-player-strength.py'
      - 'scripts/test_nba_identity_refresh.py'
      - 'scripts/verify-nba-live-analysis.mjs'
      - 'lib/nba*.ts'
      - 'lib/basketball*.ts'
      - '.github/workflows/nba-player-refresh-validation.yml'
permissions:
  contents: read
concurrency:
  group: nba-refresh-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run offline identity and integrity regressions
        run: python scripts/test_nba_identity_refresh.py
      - name: Refresh actual public archives without publishing
        run: |
          mkdir -p evidence
          cp data/nba-player-strength.json evidence/nba-before.json
          date -u +%Y-%m-%dT%H:%M:%SZ > evidence/refresh-started.txt
          python scripts/nba-player-strength.py --refresh
      - name: Verify newly captured snapshot and retained identity provenance
        run: |
          python - <<'PY'
          import json, math, os
          from datetime import datetime, timezone
          from pathlib import Path
          def ts(value):
              return datetime.fromisoformat(value.replace('Z', '+00:00')).timestamp()
          old = json.loads(Path('evidence/nba-before.json').read_text())
          new = json.loads(Path('data/nba-player-strength.json').read_text())
          started = Path('evidence/refresh-started.txt').read_text().strip()
          assert new['schema'] == 1 and len(new['teams']) == 30
          assert len(new['players']) > 300
          assert ts(started) <= ts(new['capturedAt']) <= datetime.now(timezone.utc).timestamp()
          assert new['identitySourceCapturedAt'] == old.get('identitySourceCapturedAt', old['capturedAt'])
          assert ts(new['capturedAt']) > ts(old['capturedAt'])
          assert len(new['sourceSeasons']) >= 1
          for player_id, row in new['players'].items():
              assert player_id in old['players']
              assert row['sourceId'] == old['players'][player_id]['sourceId']
              assert all(math.isfinite(row[k]) for k in ('rate', 'minutes', 'points', 'lastPlayed'))
              assert row['lastPlayed'] < ts(new['capturedAt'])
          report = {'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'commit': os.environ['GITHUB_SHA'], 'startedAt': started,
                    'previousCapturedAt': old['capturedAt'], 'capturedAt': new['capturedAt'],
                    'identitySourceCapturedAt': new['identitySourceCapturedAt'],
                    'players': len(new['players']), 'teams': len(new['teams']),
                    'sourceSeasons': new['sourceSeasons'], 'published': False}
          Path('evidence/nba-refresh-validation.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Probe actual upcoming NBA analyses
        id: live
        continue-on-error: true
        run: node scripts/verify-nba-live-analysis.mjs
      - name: Run application regression suite
        run: npm test
      - name: Build production application
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-refresh-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/nba-player-strength.json
            evidence/nba-refresh-validation.json
            evidence/nba-live-verification.json
          retention-days: 7
          if-no-files-found: error
      - name: Require actual analyses to be ready
        if: steps.live.outcome != 'success'
        run: exit 1
