name: YJ NBA pairing and source verification
on:
  push:
    branches: ['fix/yj-nba-pairing-cold-20261005']
permissions:
  contents: read
concurrency:
  group: yj-nba-pairing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Probe lightweight official public page data
        run: node scripts/probe-nba-page-data.mjs
      - name: Verify production name observations and quote propagation
        run: node --test tests/nba-market-aliases.test.mjs tests/sport-super-markets.test.mjs
      - name: Full regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yj-nba-pairing-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/nba-page-data-probe.json
          retention-days: 3
