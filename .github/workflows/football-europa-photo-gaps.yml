name: Review Europa portrait gaps
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/football-photos/research-gaps.py'
      - 'docs/football-europa-photo-gaps.json'
      - '.github/workflows/football-europa-photo-gaps.yml'
permissions:
  contents: read
jobs:
  research:
    if: startsWith(github.head_ref, 'fix/yj-europa-portrait-gaps-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow beautifulsoup4
      - run: python scripts/football-photos/research-gaps.py /tmp/europa-gaps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europa-gap-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/europa-gaps
          retention-days: 7
          if-no-files-found: error
