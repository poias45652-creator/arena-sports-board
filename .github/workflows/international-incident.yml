name: International data incident check
on:
  push:
    branches: ['fix/international-data-20260923']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/international-source-probe.mjs
      - run: node scripts/international-incident-probe.mjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --test tests/international-repair*.test.mjs
      - run: node scripts/international-incident-acceptance.mjs
      - run: npm run build
