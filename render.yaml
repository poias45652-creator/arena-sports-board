services:
  - type: web
    name: arena-sports-board
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: commit
    buildCommand: npm ci --ignore-scripts && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: TZ_BINDING_KEY
        sync: false
      - key: ARENA_SETUP_TOKEN
        sync: false
